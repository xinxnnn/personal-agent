<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>OpenClaw Skills 管理器</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .content { padding: 30px; }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .skill-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .skill-card:hover { border-color: #0f3460; background: #f0f4f8; }
        .skill-card.selected {
            border-color: #0f3460;
            background: linear-gradient(135deg, #0f346015 0%, #1a1a2e15 100%);
        }
        .skill-card h4 { margin: 0 0 8px 0; }
        .skill-card p { margin: 0; font-size: 13px; color: #666; }
        .skill-tag {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-top: 10px;
        }
        .skill-tag.recommended { background: #d4edda; color: #155724; }

        button {
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .search-section {
            margin: 20px 0;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 12px;
        }
        .search-input {
            display: flex;
            gap: 10px;
        }
        .search-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .search-input button { width: auto; padding: 10px 20px; }

        .progress {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔧 OpenClaw Skills 管理器</h1>
        <p>选择推荐技能，或从 ClawHub 搜索安装更多能力</p>
    </div>
    <div class="content">
        <div class="form-group">
            <label>👤 用户名</label>
            <input type="text" id="userName" placeholder="输入用户名" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;">
        </div>

        <h3>⭐ 推荐技能</h3>
        <div class="skills-grid" id="skillsGrid"></div>

        <button id="installBtn" onclick="installSkills()">📦 安装选中技能</button>

        <div class="search-section">
            <h3>🔍 从 ClawHub 搜索更多技能</h3>
            <div class="search-input">
                <input type="text" id="searchKeyword" placeholder="输入关键词，如 weather、browser...">
                <button onclick="searchSkills()">搜索</button>
            </div>
            <div id="searchResults" style="margin-top: 15px; max-height: 300px; overflow-y: auto;"></div>
        </div>

        <div id="progress" class="progress">
            <div class="status-text" id="statusText"></div>
        </div>
        <div id="result" class="result" style="display:none;"></div>
    </div>
</div>

<script>
    let selectedSkills = new Set();
    let currentSessionId = null;
    let statusInterval = null;

    async function loadRecommendedSkills() {
        try {
            const response = await fetch('/skills/recommended');
            const data = await response.json();
            const grid = document.getElementById('skillsGrid');
            grid.innerHTML = '';

            data.skills.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.dataset.slug = skill.slug;
                card.onclick = () => toggleSkill(skill.slug, card);
                card.innerHTML = `
                    <h4>${skill.name}</h4>
                    <p>${skill.description}</p>
                    <span class="skill-tag ${skill.recommended ? 'recommended' : ''}">
                        ${skill.recommended ? '⭐ 推荐' : ''}
                    </span>
                `;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error('加载失败:', error);
        }
    }

    function toggleSkill(slug, element) {
        if (selectedSkills.has(slug)) {
            selectedSkills.delete(slug);
            element.classList.remove('selected');
        } else {
            selectedSkills.add(slug);
            element.classList.add('selected');
        }
    }

    async function searchSkills() {
        const keyword = document.getElementById('searchKeyword').value.trim();
        if (!keyword) return;

        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '<p>🔍 搜索中...</p>';

        try {
            const response = await fetch(`/skills/search?keyword=${encodeURIComponent(keyword)}`);
            const data = await response.json();
            if (data.success) {
                resultsDiv.innerHTML = `<pre style="background:#2d2d2d; color:#f8f8f2; padding:10px; border-radius:6px; overflow-x:auto;">${data.output}</pre>`;
            } else {
                resultsDiv.innerHTML = `<p style="color:red;">搜索失败: ${data.error}</p>`;
            }
        } catch (error) {
            resultsDiv.innerHTML = `<p style="color:red;">请求失败: ${error.message}</p>`;
        }
    }

    async function installSkills() {
        const userName = document.getElementById('userName').value.trim();
        if (!userName) { alert('请输入用户名'); return; }
        if (selectedSkills.size === 0) { alert('请至少选择一个技能'); return; }

        const progressDiv = document.getElementById('progress');
        const resultDiv = document.getElementById('result');
        const installBtn = document.getElementById('installBtn');

        progressDiv.style.display = 'block';
        resultDiv.style.display = 'none';
        installBtn.disabled = true;

        try {
            const response = await fetch('/skills/install', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_name: userName,
                    selected_skills: Array.from(selectedSkills)
                })
            });
            const data = await response.json();
            if (data.success) {
                currentSessionId = data.session_id;
                startPolling();
            } else {
                showResult(false, data.message);
                installBtn.disabled = false;
            }
        } catch (error) {
            showResult(false, '请求失败: ' + error.message);
            installBtn.disabled = false;
        }
    }

    function startPolling() {
        const statusText = document.getElementById('statusText');

        statusInterval = setInterval(async () => {
            try {
                const response = await fetch(`/skills/status/${currentSessionId}`);
                const data = await response.json();
                statusText.innerText = data.message || data.status;

                if (data.status === 'completed') {
                    clearInterval(statusInterval);
                    let resultHtml = '<strong>✅ 安装完成！</strong><br><br>';
                    if (data.installed && data.installed.length > 0) {
                        resultHtml += `<p>📦 已安装: ${data.installed.join(', ')}</p>`;
                    }
                    if (data.failed && data.failed.length > 0) {
                        resultHtml += `<p style="color:red;">❌ 失败: ${data.failed.map(f => f.slug).join(', ')}</p>`;
                    }
                    showResult(true, resultHtml);
                    document.getElementById('installBtn').disabled = false;
                }
            } catch (error) {
                console.error('查询状态失败:', error);
            }
        }, 2000);
    }

    function showResult(success, html) {
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = html;
        resultDiv.style.marginTop = '20px';
        resultDiv.style.padding = '20px';
        resultDiv.style.borderRadius = '12px';
        resultDiv.style.background = success ? '#f6ffed' : '#fff2f0';
    }

    loadRecommendedSkills();
</script>
</body>
</html>
