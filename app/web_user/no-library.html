<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>无外部库测试</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .success { color: #67c23a; }
    .section { margin: 1rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>
<body>
  <h1 class="success">✅ 无外部库测试页面</h1>
  
  <div class="section">
    <h2>如果你能看到这个：</h2>
    <ul>
      <li>✅ 服务器正常工作</li>
      <li>✅ 路由正常工作</li>
      <li>✅ HTML 渲染正常</li>
    </ul>
  </div>
  
  <div class="section">
    <h2>测试按钮：</h2>
    <button onclick="testClick()">点击我</button>
    <p id="counter">点击次数: 0</p>
  </div>
  
  <script>
    let count = 0;
    function testClick() {
      count++;
      document.getElementById('counter').textContent = '点击次数: ' + count;
    }
    
    console.log('页面加载成功!');
  </script>
</body>
</html>
