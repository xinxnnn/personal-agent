<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智契化身 · 登录 · 用户控制台</title>
<style>
  :root {
    --primary:        #3867ff;
    --primary-hover:  #2d52cc;
    --primary-soft:   #ebf0ff;
    --primary-border: #c7d4ff;
    --bg:             #f4f7fb;
    --surface:        #ffffff;
    --text-title:     #0f172a;
    --text-body:      #1f2937;
    --text-muted:     #6b7280;
    --text-faint:     #94a3b8;
    --border:         #e5e7eb;
    --divider:        #eef2f7;
    --danger:         #dc2626;
    --danger-soft:    #fef2f2;
    --radius-lg:      14px;
    --radius-md:      10px;
    --radius-sm:      8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 32px rgba(15, 23, 42, .07);
    overflow: hidden;
  }
  .card-bar { height: 4px; background: linear-gradient(90deg, #3867ff 0%, #6b8cff 55%, #a5b9ff 100%); }
  .card-body { padding: 32px 32px 28px; }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .brand-mark {
    width: 46px; height: 46px; flex: 0 0 46px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, #3867ff 0%, #5f83ff 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 4px 12px rgba(56, 103, 255, .28);
  }
  .brand-text h1 {
    margin: 0; font-size: 17px; font-weight: 650;
    color: var(--text-title); letter-spacing: .2px;
  }
  .brand-text p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-muted); }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; margin-bottom: 6px;
    font-size: 12.5px; font-weight: 550; color: var(--text-body);
  }
  .field input {
    width: 100%; height: 40px; padding: 0 12px;
    font-size: 14px; font-family: inherit; color: var(--text-title);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder { color: var(--text-faint); }
  .field input:hover { border-color: #d5dbe6; }
  .field input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(56, 103, 255, .12);
  }

  .alert {
    display: none;
    align-items: flex-start; gap: 8px;
    margin-bottom: 16px; padding: 10px 12px;
    font-size: 13px; color: var(--danger);
    background: var(--danger-soft);
    border: 1px solid #fecaca;
    border-radius: var(--radius-sm);
  }
  .alert.show { display: flex; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  .btn {
    width: 100%; height: 42px; margin-top: 6px;
    font-size: 14.5px; font-weight: 600; font-family: inherit; letter-spacing: 2px;
    color: #fff; background: var(--primary);
    border: none; border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background .15s ease, box-shadow .15s ease;
  }
  .btn:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 4px 14px rgba(56, 103, 255, .3); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .65; cursor: not-allowed; letter-spacing: 1px; }

  .hint {
    margin-top: 24px; padding-top: 20px;
    border-top: 1px solid var(--divider);
  }
  .hint-title {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px;
  }
  .hint-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--primary-soft);
    border: 1px solid var(--primary-border);
    border-radius: var(--radius-sm);
  }
  .hint-row code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 12.5px; color: #24408f; font-weight: 600;
  }
  .hint-sep { color: var(--text-faint); }
  .hint-row .fill {
    margin-left: auto;
    padding: 4px 10px;
    font-size: 12px; font-family: inherit; font-weight: 550;
    color: var(--primary); background: #fff;
    border: 1px solid var(--primary-border);
    border-radius: 6px; cursor: pointer;
    transition: background .15s ease;
  }
  .hint-row .fill:hover { background: #fff; border-color: var(--primary); }
  .hint-note { margin: 10px 0 0; font-size: 11.5px; color: var(--text-faint); }

  .foot {
    margin-top: 18px; text-align: center;
    font-size: 11.5px; color: var(--text-faint);
  }
  @media (max-width: 480px) {
    .card-body { padding: 26px 20px 22px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-bar"></div>
    <div class="card-body">
      <div class="brand">
        <div class="brand-mark">U</div>
        <div class="brand-text">
          <h1>用户控制台</h1>
          <p>可信个人智能体 · 身份构建与智能体管理</p>
        </div>
      </div>

      <div class="alert" id="alert"><span>&#9888;</span><span id="alertText"></span></div>

      <form id="form" autocomplete="on">
        <div class="field">
          <label for="username">用户名</label>
          <input id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn" type="submit" id="submit">登 录</button>
      </form>

      <div class="hint">
        <div class="hint-title">演示账号</div>
        <div class="hint-row">
          <code>user</code>
          <span class="hint-sep">/</span>
          <code>pa@2026</code>
          <button type="button" class="fill" id="fill">一键填入</button>
        </div>
        <p class="hint-note">本端为个人用户入口，用于申请人格凭证（PHC）与创建个人智能体。</p>
      </div>

      <div class="foot">可信个人智能体身份构建系统</div>
    </div>
  </div>

<script>
(function () {
  var LOGIN_URL  = "/user/api/login";
  var HOME_URL   = "/user";
  var DEMO_USER  = "user";
  var DEMO_PWD   = "pa@2026";

  var form      = document.getElementById('form');
  var userEl    = document.getElementById('username');
  var pwdEl     = document.getElementById('password');
  var btn       = document.getElementById('submit');
  var alertBox  = document.getElementById('alert');
  var alertText = document.getElementById('alertText');

  // 支持 ?next= 回跳，但要挡住开放重定向：只接受本端路径
  var params = new URLSearchParams(location.search);
  var next   = params.get('next') || '';
  if (!next || next.charAt(0) !== '/' || next.indexOf('//') === 0) {
    next = HOME_URL;
  }

  document.getElementById('fill').addEventListener('click', function () {
    userEl.value = DEMO_USER;
    pwdEl.value  = DEMO_PWD;
    hideAlert();
    pwdEl.focus();
  });

  function showAlert(msg) {
    alertText.textContent = msg;
    alertBox.classList.add('show');
  }
  function hideAlert() { alertBox.classList.remove('show'); }

  [userEl, pwdEl].forEach(function (el) {
    el.addEventListener('input', hideAlert);
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var u = userEl.value.trim();
    var p = pwdEl.value;
    if (!u) { showAlert('请输入用户名'); userEl.focus(); return; }
    if (!p) { showAlert('请输入密码'); pwdEl.focus(); return; }

    btn.disabled = true;
    btn.textContent = '登录中…';
    hideAlert();

    try {
      var r = await fetch(LOGIN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: u, password: p })
      });

      if (r.ok) {
        btn.textContent = '登录成功，正在进入…';
        location.replace(next);
        return;
      }

      var msg = '登录失败，请重试';
      if (r.status === 401) {
        msg = '用户名或密码错误';
      } else {
        try {
          var d = await r.json();
          if (d && (d.detail === 'unauthorized')) { msg = '登录状态异常，请重试'; }
          else if (d && typeof d.detail === 'string' && d.detail !== 'invalid_credentials') { msg = d.detail; }
        } catch (_) {}
      }
      showAlert(msg);
    } catch (err) {
      showAlert('无法连接服务，请确认后端已启动');
    } finally {
      btn.disabled = false;
      btn.textContent = '登 录';
    }
  });
})();
</script>
</body>
</html>
