<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 智契化身</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./login.css">
  <link rel="stylesheet" href="./button-motion.css">
  <link rel="stylesheet" href="./ambient-motion.css">
</head>
<body class="login-page">
<div class="login-shell">

  <!-- ================= 左侧欢迎区 ================= -->
  <section class="welcome">
    <a class="brand" href="./login.html">
      <span class="brand-icon">契</span>
      <span>智契化身</span>
    </a>

    <div class="welcome-copy">
      <p class="eyebrow" style="opacity: 0.55; font-size: 11.5px; letter-spacing: 1.5px;">A LITTLE HELP. A LOT MORE POSSIBILITY.</p>

      <!-- 主标题：调整了字号（41px）和字间距（0.5px），完美适配两行，深墨绿显高级 -->
      <h1 style="color: #1a3827; font-weight: 800; font-size: 41px; line-height: 1.3; margin-top: 16px; margin-bottom: 20px; letter-spacing: 0.5px;">
        这一契，<br>带你开启网络里的新生
      </h1>

      <!-- 弱化描述文字 -->
      <p style="color: #6b7280; font-size: 15px;">创建属于你的可信化身，探索网络里的更多可能。</p>
    </div>

    <div class="welcome-art" aria-hidden="true">
      <div class="welcome-ring ring-one"></div>
      <div class="welcome-ring ring-two"></div>
      <div class="welcome-orb">✳</div>
      <span class="spark spark-one">✧</span>
      <span class="spark spark-two">✧</span>
    </div>

    <div class="welcome-foot">
      <span class="green-dot"></span> 即刻开启你的专属数字分身
    </div>
  </section>

  <!-- ================= 右侧登录区 ================= -->
  <section class="login-side" aria-labelledby="login-title">
    <div class="login-content">
      <span class="login-kicker">你的个人空间</span>
      <h2 id="login-title">欢迎回来</h2>

      <!-- 副标题：去掉了刺眼的蓝色和加粗，换成了低饱和度的灰绿色 -->
      <p class="login-description" style="color: #5c6b5d; font-size: 14.5px;">登录智契化身，唤醒你的专属数字分身。</p>

      <form id="login-form">
        <label for="username">账号</label>
        <input id="username" name="username" required autocomplete="username" placeholder="请输入账号" autofocus maxlength="128">

        <label for="password">密码</label>
        <div class="password-field">
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="请输入密码">
          <button type="button" id="toggle-password" aria-label="显示密码" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p id="login-error" role="alert" aria-live="polite"></p>

        <button type="submit" class="primary login-submit">进入我的空间 <span aria-hidden="true">→</span></button>
      </form>

      <aside class="demo-account" aria-label="默认测试账号">
        <strong>默认测试账号</strong>
        <p>账号：<code>user</code>　密码：<code>pa@2026</code></p>
        <button type="button" id="fill-demo" class="secondary">一键填入</button>
      </aside>
    </div>

    <p class="login-footer">智契化身 · 可信个人数字空间</p>
  </section>

</div>
<script src="./login.js" defer></script>
<script src="./button-motion.js" defer></script>
<script src="./ambient-motion.js" defer></script>
</body>
</html>
